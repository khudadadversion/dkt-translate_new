name: Translate DKT questions

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: translate
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TIME_BUDGET_MIN: "300"
        run: python translate_dkt.py all

      - name: Show progress
        if: always()
        run: python translate_dkt.py status

      - name: Commit progress
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git pull --rebase || true
          git add dkt_nsw_multilang.json checkpoint.json validation_report.json errors.log || true
          git diff --staged --quiet && echo "nothing new" || git commit -m "progress $(date -u +%F_%H%M)"
          git push || true


